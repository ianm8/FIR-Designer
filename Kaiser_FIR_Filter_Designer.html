<!doctype html>
<html><head><meta charset="utf-8"><title>Kaiser FIR Filter Designer</title>
<style>
body{font-family:Arial,sans-serif;max-width:1050px;margin:25px auto;padding:0 15px;color:#222}
label{display:inline-block;margin:6px 14px 6px 0} input,select{padding:5px;font-size:15px;width:105px}
button{padding:8px 16px;font-size:15px} canvas{width:100%;height:300px;border:1px solid #aaa;margin-top:10px}
pre{background:#f5f5f5;padding:12px;overflow:auto}.row{display:flex;gap:20px;flex-wrap:wrap}.panel{flex:1 1 470px}
</style></head><body>
<h1>Kaiser-Bessel FIR Filter Designer</h1>
<p>Standalone version based on the Kaiser-window FIR algorithm published by A. R. Collins on the ARC Filter Design page.</p>
<fieldset><legend>Filter parameters</legend>
<label>Sample rate Fs <input id="fs" type="number" value="48000"></label>
<label>Type <select id="type"><option>Low pass</option><option>High pass</option><option>Band pass</option><option>Band stop</option></select></label>
<label>Number of taps M <input id="m" type="number" value="101"></label><br>
<label>Fa (Hz) <input id="fa" type="number" value="3000"></label>
<label>Fb (Hz) <input id="fb" type="number" value="4000"></label>
<label>Attenuation (dB) <input id="att" type="number" value="60"></label>
<button onclick="calculate()">CALCULATE FILTER</button>
</fieldset>
<div id="status"></div>
<div class="row"><div class="panel"><h2>Frequency response</h2><canvas id="freq" width="1000" height="300"></canvas></div>
<div class="panel"><h2>Impulse response</h2><canvas id="imp" width="1000" height="300"></canvas></div></div>
<h2>Coefficients</h2><button onclick="copyCoeffs()">COPY COEFFICIENTS</button>
<pre id="out">No filter calculated.</pre>

<script>
let H=[];
function Ino(x){let d=0,ds=1,s=1;do{d+=2;ds*=x*x/(d*d);s+=ds}while(ds>s*1e-6);return s}
function alpha(a){return a<21?0:a>50?0.1102*(a-8.7):0.5842*Math.pow(a-21,.4)+0.07886*(a-21)}
function calculate(){
 const Fs=+fs.value, typ=type.value, M0=+m.value, Fa=+fa.value, Fb=+fb.value, Att=+att.value;
 if(!Number.isFinite(Fs)||Fs<1000||Fs>1e6)return bad("Fs must be 1 kHz to 1 MHz.");
 if(!Number.isInteger(M0)||M0<3||M0>=500)return bad("M must be an integer from 3 to 499.");
 if(M0%2===0){m.value=M0+1} const M=+m.value, N=(M-1)/2;
 const ny=Fs/2;
 if(typ==="Low pass"){ if(!(Fb>0&&Fb<ny))return bad("Require 0 < Fb < Fs/2."); }
 else if(typ==="High pass"){ if(!(Fa>0&&Fa<ny))return bad("Require 0 < Fa < Fs/2."); }
 else if(!(Fa>=0&&Fb>Fa&&Fb<ny))return bad("Require 0 <= Fa < Fb < Fs/2.");
 const A=[], a=alpha(Att), ia=Ino(a); H=new Array(M);
 for(let j=0;j<=N;j++){
   let x;
   if(j===0){
     if(typ==="Low pass") x=2*Fb/Fs;
     else if(typ==="High pass") x=1-2*Fa/Fs;
     else if(typ==="Band pass") x=2*(Fb-Fa)/Fs;
     else x=1-2*(Fb-Fa)/Fs;
   }else{
     if(typ==="Low pass") x=Math.sin(2*j*Math.PI*Fb/Fs)/(j*Math.PI);
     else if(typ==="High pass") x=-Math.sin(2*j*Math.PI*Fa/Fs)/(j*Math.PI);
     else if(typ==="Band pass") x=(Math.sin(2*j*Math.PI*Fb/Fs)-Math.sin(2*j*Math.PI*Fa/Fs))/(j*Math.PI);
     else x=(Math.sin(2*j*Math.PI*Fa/Fs)-Math.sin(2*j*Math.PI*Fb/Fs))/(j*Math.PI);
   }
   A[j]=x; H[N+j]=x*Ino(a*Math.sqrt(Math.max(0,1-j*j/(N*N))))/ia;
 }
 for(let j=0;j<N;j++)H[j]=H[M-1-j];
 const mn=Math.min(...H),mx=Math.max(...H);
 status.textContent=`Calculated ${M} taps; Kaiser alpha = ${a.toFixed(5)}; coefficient range ${mn.toExponential(5)} to ${mx.toExponential(5)}.`;
 out.textContent=H.map((v,i)=>`${i.toString().padStart(4)}  ${v.toPrecision(12)}`).join("\n");
 drawImp();drawFreq();
}
function bad(s){status.textContent="Error: "+s}
function setup(id){let c=document.getElementById(id),r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;let x=c.getContext("2d");x.setTransform(r,0,0,r,0,0);return [x,w,h]}
function drawImp(){let [c,w,h]=setup("imp");c.clearRect(0,0,w,h);let max=Math.max(...H.map(Math.abs),1e-12),mid=h/2;c.beginPath();H.forEach((v,i)=>{let x=45+i*(w-60)/(H.length-1),y=mid-v/max*(h-55)/2;c.moveTo(x,mid);c.lineTo(x,y)});c.stroke()}
function drawFreq(){let [c,w,h]=setup("freq"),Fs=+fs.value,n=1024,L=45,R=10,T=10,B=30;let mag=[];
 for(let k=0;k<n;k++){let f=k/(n-1)*Fs/2,re=0,im=0;for(let j=0;j<H.length;j++){let p=-2*Math.PI*f*j/Fs;re+=H[j]*Math.cos(p);im+=H[j]*Math.sin(p)}mag[k]=20*Math.log10(Math.max(Math.hypot(re,im),1e-12))}
 let top=Math.ceil(Math.max(...mag)/10)*10,bot=Math.max(-120,top-100);c.clearRect(0,0,w,h);
 c.font="12px Arial";c.beginPath();for(let d=top;d>=bot;d-=10){let y=T+(top-d)/(top-bot)*(h-T-B);c.moveTo(L,y);c.lineTo(w-R,y);c.fillText(d+" dB",4,y+4)}c.strokeStyle="#ccc";c.stroke();c.strokeStyle="#000";
 c.beginPath();mag.forEach((d,k)=>{let x=L+k/(n-1)*(w-L-R),y=T+(top-d)/(top-bot)*(h-T-B);k?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
 for(let i=0;i<=5;i++){let x=L+i/5*(w-L-R);c.textAlign=i===0?"left":i===5?"right":"center";c.fillText((Fs/2000*i/5).toFixed(2).replace(/\.?0+$/,"")+" kHz",x,h-8)}
 c.textAlign="left";
}
async function copyCoeffs(){if(!H.length)return;try{await navigator.clipboard.writeText(H.map(v=>v.toPrecision(12)).join(",\n"));status.textContent="Coefficients copied to clipboard."}catch(e){status.textContent="Clipboard unavailable; copy them from the box above."}}
function upd(){const t=type.value;fa.disabled=(t==="Low pass");fb.disabled=(t==="High pass")}
type.addEventListener("change",upd);upd();
calculate();
</script></body></html>
